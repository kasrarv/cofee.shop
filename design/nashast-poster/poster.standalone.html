  --ivory:    #FBF4E5;   /* صفحاتِ کتاب، تکه‌کاغذِ چسبانده‌شده */
  --ink:      #17306B;   /* آبیِ کبالت — متنِ اصلی */
  --crimson:  #A31E2F;   /* زرشکیِ گرم — پرده و تأکیدِ بلند */
  --burgundy: #6D1421;   /* سایهٔ چینِ پرده */
  --turq:     #1B9299;   /* فیروزهٔ ایرانی — تأکیدِ آرام */
  --orange:   #DE7429;   /* نارنجیِ ایرانی — ترامِ چاپ و خطای ثبت */

  --sans: 'Vazirmatn', system-ui, sans-serif;
  --serif:'Markazi Text', 'Vazirmatn', serif;
  --disp: 'Lalezar', 'Vazirmatn', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#20242B;overflow:hidden}
body{display:grid;place-items:center}
.stage{transform:scale(var(--fit,1));transform-origin:center}

.poster{
  --u: calc(var(--W) / 1080 * 1px);
  --bleed: 0px;
  --padX: calc(84 * var(--u));
  position:relative;
  width:calc(var(--W) * 1px + 2 * var(--bleed));
  height:calc(var(--H) * 1px + 2 * var(--bleed));
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.poster.bleed{--bleed:11.34px}

/* بافتِ کاغذ و دانهٔ چاپ — طرح روی کاغذ می‌نشیند، نه روی شیشه */
.paper-tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.40;
  background-image:var(--grain);background-size:calc(300 * var(--u)) calc(300 * var(--u))}
.warmth{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
  background:radial-gradient(120% 80% at 50% 112%, rgba(122,86,40,.30), rgba(0,0,0,0) 56%)}

.trim{position:absolute;inset:var(--bleed);display:flex;flex-direction:column}

/* ── تصویرِ اصلی ─────────────────────────────────────────────────────── */
.hero{position:relative;flex:0 0 auto}
.heroTop{background:var(--crimson)}
.hero svg{display:block;width:100%;height:auto}

.masthead{position:absolute;right:0;left:0;text-align:center;color:var(--ivory)}
.masthead .org{font-size:calc(23 * var(--u));font-weight:600;letter-spacing:-.005em}
.masthead .ser{margin-top:calc(8 * var(--u));font-size:calc(15 * var(--u));font-weight:400;
  letter-spacing:.11em;color:rgba(251,244,229,.84)}
.masthead .orn{margin:calc(13 * var(--u)) auto 0;width:calc(104 * var(--u));height:1px;
  background:rgba(251,244,229,.42);position:relative}
.masthead .orn::after{content:"";position:absolute;top:calc(-3.5 * var(--u));left:50%;
  width:calc(8 * var(--u));height:calc(8 * var(--u));margin-left:calc(-4 * var(--u));
  background:var(--turq);transform:rotate(45deg)}
.edition{position:absolute;left:var(--padX);font-size:calc(14 * var(--u));font-weight:500;
  letter-spacing:.15em;color:rgba(251,244,229,.74)}

/* ── ستونِ متن ───────────────────────────────────────────────────────── */
.body{position:relative;flex:1 1 auto;display:flex;flex-direction:column;
  padding:0 var(--padX) calc(var(--padB, 32) * var(--u));min-height:0}
.body > *{flex:0 0 auto}
.gap{flex:1 1 auto;min-height:calc(6 * var(--u))}
.gap.s{flex:.85 1 auto}

/* ۱ ــ عنوان: قفلِ دوتکه‌ای — واژه‌ها، و عددِ سال با اختلافِ اندازهٔ زیاد */
.lockup{display:flex;align-items:flex-end;gap:calc(20 * var(--u));
  margin-top:calc(var(--lockUp) * var(--u) * -1)}
.title{flex:1 1 auto;font-family:var(--disp);font-weight:400;line-height:1.16;
  font-size:calc(82 * var(--u));color:var(--ink)}
.accent{flex:0 0 auto;max-width:46%;font-family:var(--disp);line-height:.9;
  font-size:calc(158 * var(--u));color:var(--crimson);
  text-shadow:calc(4 * var(--u)) calc(4 * var(--u)) 0 rgba(222,116,41,.38)}

/* ۲ ــ تکه‌کاغذِ چسبانده‌شده: اثر و نویسنده */
.patch{position:relative;margin-top:calc(20 * var(--u));width:calc(100% + var(--padX));
  margin-right:calc(var(--padX) * -1);background:var(--ivory);
  padding:calc(16 * var(--u)) var(--padX) calc(22 * var(--u)) calc(30 * var(--u));
  transform:rotate(-.6deg);
  filter:drop-shadow(calc(-4 * var(--u)) calc(7 * var(--u)) calc(9 * var(--u)) rgba(60,40,20,.24))}
.lbl{font-size:calc(15 * var(--u));font-weight:600;letter-spacing:.16em;color:var(--turq)}
.books{margin-top:calc(8 * var(--u))}
.book{font-family:var(--serif);font-weight:700;font-size:calc(52 * var(--u));line-height:1.1;
  letter-spacing:-.01em;color:var(--ink)}
.book + .book::before{content:"";display:block;width:calc(48 * var(--u));
  height:calc(2 * var(--u));background:var(--crimson);margin:calc(11 * var(--u)) 0}
.author{margin-top:calc(9 * var(--u));font-size:calc(22 * var(--u));font-weight:500;
  color:rgba(23,48,107,.76)}

/* ۳ ــ اهالی نشست: دو ستونِ آزاد، بدون قاب و بدون جدول */
.people{margin-top:calc(20 * var(--u));display:grid;gap:calc(26 * var(--u));
  grid-template-columns:var(--peopleCols,1fr 1px 1fr)}
.people .rule{background:rgba(23,48,107,.15)}
.grp + .grp{margin-top:calc(13 * var(--u))}
.names{margin-top:calc(5 * var(--u));font-size:calc(29 * var(--u));font-weight:700;
  line-height:1.38;letter-spacing:-.014em}

/* ۴ ــ زمان و مکان: یک سطرِ بلندِ زرشکی، نه نوار و نه جدول */
.when{margin-top:calc(20 * var(--u));padding-top:calc(16 * var(--u));
  border-top:calc(2.5 * var(--u)) solid var(--crimson)}
.when .date{font-family:var(--disp);font-size:calc(41 * var(--u));line-height:1.2;
  color:var(--crimson)}
.when .date i{font-style:normal;color:var(--orange);margin:0 calc(13 * var(--u));
  font-size:calc(24 * var(--u));vertical-align:middle}
.when .venue{margin-top:calc(4 * var(--u));font-size:calc(27 * var(--u));font-weight:700;
  letter-spacing:-.012em}
.when .addr{margin-top:calc(7 * var(--u));font-size:calc(17 * var(--u));
  color:rgba(23,48,107,.60);display:flex;gap:calc(16 * var(--u));flex-wrap:wrap}
.when .addr b{font-weight:500;color:var(--turq)}

/* ۵ ــ لوگوها: یک ردیفِ هویتی، بدون مستطیل */
.logos{margin-top:calc(17 * var(--u));display:flex;align-items:center;
  gap:calc(15 * var(--u));flex-wrap:wrap}
.logos .cap{font-size:calc(13 * var(--u));font-weight:600;letter-spacing:.18em;
  color:rgba(23,48,107,.40);white-space:nowrap}
.logo{font-size:calc(15 * var(--u));font-weight:600;color:rgba(23,48,107,.82);
  display:flex;align-items:center;gap:calc(15 * var(--u));white-space:nowrap}
.logo::before{content:"";width:calc(4 * var(--u));height:calc(4 * var(--u));border-radius:50%;
  background:rgba(23,48,107,.26)}
.logo.opt{color:rgba(23,48,107,.46)}
/* جای‌گذاریِ فایلِ لوگو: <span class="logo"><img src="./logos/…svg" alt="…"></span> */
.logo img{height:calc(46 * var(--u));width:auto;display:block}
.latin{margin-top:calc(10 * var(--u));direction:ltr;text-align:left;
  font-size:calc(11 * var(--u));font-weight:500;letter-spacing:.24em;
  color:rgba(23,48,107,.34)}

/* علامت‌های برش (فقط قطع چاپی) */
.marks{position:absolute;inset:0;pointer-events:none;display:none}
.poster.bleed .marks{display:block}
.marks i{position:absolute;background:rgba(23,48,107,.72)}

@media print{ html,body{background:#fff;overflow:visible} @page{ size:auto; margin:0 } }

const DATA = {

  latin:     'IRANIAN PLAYWRIGHTS & TRANSLATORS GUILD · HOUSE OF THEATRE',

  post:  { W:1080,    H:1350,   hero:540, title:70, accent:130, lockUp:12 },

<div class="stage"><article class="poster" id="poster"></article></div>

<script>
/* بافتِ کاغذ: الیاف و دانهٔ چاپ، کاشیِ کوچکی که با اندازهٔ پوستر بزرگ می‌شود */
const GRAIN = "url(\"data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
  '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.62 0.95" numOctaves="4" stitchTiles="stitch"/>' +
  '<feColorMatrix type="saturate" values="0"/></filter>' +
  '<rect width="300" height="300" filter="url(#n)" opacity="0.6"/></svg>') + "\")";

/* ── تصویرِ اصلی: طاقِ ایرانی، ماه، کتابِ باز، صندلیِ خالی ────────────────
   یک تکهٔ کاغذِ زرشکیِ پاره‌شده روی کاغذِ کرم چسبانده شده؛ از طاقِ آن شبِ صحنه
   پیداست. صحنه در مختصاتِ ۶۸۰ کشیده و بعد به ارتفاعِ دلخواه مقیاس می‌شود. */
function artwork(HERO){
  const W = 1080, H = HERO, S = H / 680, CX = 540;
  const APEX = 178, SPRING = 460, HALF = 322;
  const T = `translate(${CX} 0) scale(${S.toFixed(4)}) translate(${-CX} 0)`;

  /* طاقِ کلیل: عمود از پاکار، بعد جمع‌شدن به یک نوکِ ملایم */
  const rise = SPRING - APEX;
  const arch =
    `M${CX - HALF} 680 L${CX - HALF} ${SPRING}` +
    ` C${CX - HALF} ${(SPRING - rise * .52).toFixed(0)}` +
    ` ${(CX - HALF * .46).toFixed(0)} ${(APEX + rise * .40).toFixed(0)} ${CX} ${APEX}` +
    ` C${(CX + HALF * .46).toFixed(0)} ${(APEX + rise * .40).toFixed(0)}` +
    ` ${CX + HALF} ${(SPRING - rise * .52).toFixed(0)} ${CX + HALF} ${SPRING}` +
    ` L${CX + HALF} 680 Z`;

  /* لبهٔ پاره‌شدهٔ پایینِ تکه‌کاغذ — تصادفیِ ثابت */
  let seed = 4711;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  let edge = `M0 0 L${W} 0 L${W} ${(H - 22).toFixed(1)}`;
  for (let x = W - 24; x >= 0; x -= 24)
    edge += ` L${x} ${(H - 22 - rnd() * 20).toFixed(1)}`;
  edge += ' L0 0 Z';

  /* صندلیِ خالی — سایه‌نمای تو‌پُر، مثل مهرِ چاپ */
  const q = (...p) => `<polygon points="${p.join(' ')}"/>`;
  const chair = `<g fill="#17306B">
    ${q('468,432','612,426','612,447','468,453')}
    ${q('590,428','608,427','602,330','586,331')}
    ${q('556,430','572,429','566,332','552,333')}
    ${q('548,332','610,326','610,344','548,350')}
    ${q('552,372','604,367','604,382','552,387')}
    ${q('476,446','492,445','484,540','468,540')}
    ${q('596,444','612,443','622,538','606,538')}
    ${q('478,482','610,475','610,489','478,496')}
  </g>`;

  return `
  <svg viewBox="0 0 ${W} ${H}" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="tram" width="12" height="12" patternUnits="userSpaceOnUse">
        <circle cx="6" cy="6" r="2.6" fill="#DE7429"/>
      </pattern>
      <pattern id="tramInk" width="13" height="13" patternUnits="userSpaceOnUse">
        <circle cx="6.5" cy="6.5" r="2.2" fill="#17306B"/>
      </pattern>
      <clipPath id="cutArch"><path d="${arch}" transform="${T}"/></clipPath>
      <clipPath id="cutSheet"><path d="${edge}"/></clipPath>
      <clipPath id="cutMoonLo"><circle cx="${CX + 126}" cy="428" r="188"/></clipPath>
      <mask id="holeArch">
        <rect width="${W}" height="${H}" fill="#fff"/>
        <path d="${arch}" fill="#000" transform="${T}"/>
      </mask>
    </defs>

    <g clip-path="url(#cutSheet)">
      <!-- شبِ صحنه، از دلِ طاق -->
      <g transform="${T}"><path d="${arch}" fill="#17306B"/></g>

      <g clip-path="url(#cutArch)">
        <g transform="${T}">
          <!-- ماه -->
          <circle cx="${CX}" cy="372" r="150" fill="#EFDCA8"/>
          <g clip-path="url(#cutMoonLo)" opacity=".32">
            <circle cx="${CX}" cy="372" r="150" fill="url(#tramInk)"/>
          </g>
          <circle cx="${CX + 10}" cy="381" r="150" fill="none" stroke="#DE7429"
                  stroke-width="4" opacity=".5"/>

          <!-- کفِ صحنه -->
          <rect x="0" y="600" width="${W}" height="90" fill="#1E3B84"/>
          <rect x="0" y="598" width="${W}" height="3" fill="#EFDCA8" opacity=".26"/>

          <!-- کتابِ باز: صحنه‌ای که صندلی روی آن ایستاده -->
          <ellipse cx="${CX}" cy="584" rx="248" ry="18" fill="#0C1B45" opacity=".55"/>
          <path d="M322 516 C392 504 466 510 540 534" stroke="#DE7429" stroke-width="4"
                opacity=".55" transform="translate(9,10)"/>
          <path d="M540 534 C466 510 392 504 322 516 L322 570 C392 558 466 564 540 588 Z"
                fill="#FBF4E5" stroke="#17306B" stroke-width="4.5"/>
          <path d="M540 534 C614 510 688 504 758 516 L758 570 C688 558 614 564 540 588 Z"
                fill="#FBF4E5" stroke="#17306B" stroke-width="4.5"/>
          <path d="M540 534 L540 588" stroke="#17306B" stroke-width="4.5"/>
          <g stroke="#17306B" stroke-width="2.6" opacity=".3">
            <path d="M540 548 C480 528 422 522 360 530"/>
            <path d="M540 561 C480 543 422 537 360 545"/>
            <path d="M540 548 C600 528 658 522 720 530"/>
            <path d="M540 561 C600 543 658 537 720 545"/>
          </g>

          ${chair}
        </g>
      </g>

      <!-- تکه‌کاغذِ زرشکی با طاقِ بریده -->
      <rect width="${W}" height="${H}" fill="#A31E2F" mask="url(#holeArch)"/>
      <g stroke="#6D1421" stroke-width="3.4" opacity=".38">
        ${Array.from({length:6},(_,i)=>{const x=24+i*34;
          return `M${x} 16 C${x - 4} ${(H*.36).toFixed(0)} ${x - 10} ${(H*.66).toFixed(0)}` +
                 ` ${x - 16} ${(H - 28).toFixed(0)}`;}).join('')}
        ${Array.from({length:6},(_,i)=>{const x=W-24-i*34;
          return `M${x} 16 C${x + 4} ${(H*.36).toFixed(0)} ${x + 10} ${(H*.66).toFixed(0)}` +
                 ` ${x + 16} ${(H - 28).toFixed(0)}`;}).join('')}
      </g>
      <g opacity=".26" mask="url(#holeArch)">
        <rect x="0" y="${(H - 170).toFixed(0)}" width="${W}" height="146" fill="url(#tram)"/>
      </g>
      <!-- خطِ طاق و خطای عمدیِ ثبتِ رنگ -->
      <g transform="${T}">
        <path d="${arch}" fill="none" stroke="#EFDCA8" stroke-width="3" opacity=".5"/>
        <path d="${arch}" fill="none" stroke="#DE7429" stroke-width="4" opacity=".45"
              transform="translate(10,11)"/>
      </g>
    </g>
  </svg>`;
}

function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

/* لبهٔ پاره‌شدهٔ تکه‌کاغذ — تصادفیِ ثابت، تا هر بار یک‌شکل بماند */
function torn(){
  let seed = 20250829;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pts = ['0% 0%', '100% 0%'];
  for (let x = 100; x >= 0; x -= 4) pts.push(`${x}% ${(100 - rnd() * 3.6).toFixed(2)}%`);
  return `polygon(${pts.join(',')})`;
}

function build(fmt){
  const F = FORMATS[fmt] || FORMATS.post;
  const el = document.getElementById('poster');
  const padY = F.padY || 0;
  el.className = 'poster' + (F.bleed ? ' bleed' : '');
  el.style.setProperty('--W', F.W);
  el.style.setProperty('--H', F.H);
  el.style.setProperty('--grain', GRAIN);
  el.style.setProperty('--lockUp', F.lockUp);
  if (F.padB) el.style.setProperty('--padB', F.padB);

  const groups = DATA.rows.filter(r => r.names && r.names.filter(Boolean).length);
  const head = groups.slice(0, 1), tail = groups.slice(1);
  const grp = g => `<div class="grp"><div class="lbl">${esc(g.label)}</div>
      <div class="names">${g.names.filter(Boolean).map(esc).join('<br>')}</div></div>`;

  el.innerHTML = `
    <div class="marks">${['0 0','1 0','0 1','1 1'].map(p=>{
      const [x,y] = p.split(' ').map(Number);
      const v = `${x?'right':'left'}:calc(var(--bleed) - 1px);${y?'bottom':'top'}:0;width:1px;height:var(--bleed)`;
      const h = `${y?'bottom':'top'}:calc(var(--bleed) - 1px);${x?'right':'left'}:0;height:1px;width:var(--bleed)`;
      return `<i style="${v}"></i><i style="${h}"></i>`;}).join('')}</div>

    <div class="trim">
      <header class="hero">
        ${padY ? `<div class="heroTop" style="height:calc(${padY} * var(--u))"></div>` : ''}
        ${artwork(F.hero)}
        <div class="masthead" style="top:calc(${padY + 48} * var(--u))">
          <div class="org">${esc(DATA.organizer)}</div>
          <div class="ser">${esc(DATA.series)}</div>
          <div class="orn"></div>
        </div>
        ${DATA.edition ? `<div class="edition"
          style="top:calc(${padY + 50} * var(--u))">${esc(DATA.edition)}</div>` : ''}
      </header>

      <div class="body">
        <div class="lockup">
          <h1 class="title" id="title">${esc(DATA.title)}</h1>
          ${DATA.accent ? `<div class="accent" id="accent">${esc(DATA.accent)}</div>` : ''}
        </div>

        <section class="patch" id="patch">
          <div class="lbl">${esc(DATA.booksLabel)}</div>
          <div class="books">${DATA.books.filter(Boolean)
            .map(b => `<div class="book">${esc(b)}</div>`).join('')}</div>
          ${DATA.author ? `<div class="author">${esc(DATA.author)}</div>` : ''}
        </section>

        <div class="gap s"></div>

        <section class="people"${tail.length ? '' : ' style="--peopleCols:1fr"'}>
          <div>${head.map(grp).join('')}</div>
          ${tail.length ? `<div class="rule"></div><div>${tail.map(grp).join('')}</div>` : ''}
        </section>

        <div class="gap"></div>

        <section class="when">
          <div class="date">${esc(DATA.date)}${DATA.time
            ? `<i>◆</i>ساعت ${esc(DATA.time)}` : ''}</div>
          ${DATA.venue ? `<div class="venue">${esc(DATA.venue)}</div>` : ''}
          <div class="addr"><span>${esc(DATA.address || '')}</span>
            ${DATA.entry ? `<b>${esc(DATA.entry)}</b>` : ''}</div>
        </section>

        <footer class="logos">
          <span class="cap">با همکاری</span>
          ${DATA.logos.map(l => `<span class="logo${l.required ? '' : ' opt'}">${esc(l.name)}</span>`).join('')}
        </footer>
        ${DATA.latin ? `<div class="latin">${esc(DATA.latin)}</div>` : ''}
      </div>
    </div>

    <div class="paper-tex"></div>
    <div class="warmth"></div>`;

  document.getElementById('patch').style.clipPath = torn();
}

/* شمارشِ سطر با Range — ارتفاعِ بلوک به‌خاطر کشیدگیِ حروف فارسی گمراه‌کننده است */
function lineCount(el){
  const r = document.createRange();
  r.selectNodeContents(el);
  return new Set([...r.getClientRects()].filter(b => b.height > 1)
    .map(b => Math.round(b.top))).size || 1;
}
function fitText(el, maxPx, minPx, maxLines){
  if (!el) return;
  let lo = minPx, hi = maxPx;
  el.style.fontSize = maxPx + 'px';
  if (lineCount(el) <= maxLines) return;
  for (let i = 0; i < 18; i++){
    const mid = (lo + hi) / 2;
    el.style.fontSize = mid + 'px';
    if (lineCount(el) <= maxLines) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + 'px';
}

async function render(fmt){
  build(fmt);
  await document.fonts.ready;
  const F = FORMATS[fmt] || FORMATS.post;
  const u = F.W / 1080;

  const accent = document.getElementById('accent');
  fitText(accent, F.accent * u, 54 * u, 1);
  fitText(document.getElementById('title'),
          (accent ? F.title : F.title * 1.22) * u, 34 * u, 2);

  const books = [...document.querySelectorAll('.book')];
  books.forEach(b => fitText(b, (books.length > 1 ? 46 : 58) * u, 24 * u, 2));

  /* شبکهٔ ایمنی: متنِ غیرعادی بلند، ستون را جمع می‌کند تا چیدمان نشکند */
  const body = document.querySelector('.body');
  body.style.transform = 'none';
  const kids = [...body.children];
  const inner = kids[kids.length - 1].getBoundingClientRect().bottom
              - body.getBoundingClientRect().top;
  const avail = body.clientHeight - parseFloat(getComputedStyle(body).paddingBottom);
  if (inner > avail + 1){
    const k = Math.max(0.78, avail / inner);
    body.style.transformOrigin = 'top center';
    body.style.transform = `scale(${k})`;
  }
  document.body.dataset.ready = '1';
}

const P = new URLSearchParams(location.search);
const FMT = P.get('f') || 'post';
function fitViewport(){
  if (P.get('fit') === '0'){ document.querySelector('.stage').style.setProperty('--fit', 1); return; }
  const F = FORMATS[FMT] || FORMATS.post;
  const b = F.bleed ? 22.68 : 0;
  const k = Math.min(1, (innerWidth - 24) / (F.W + b), (innerHeight - 24) / (F.H + b));
  document.querySelector('.stage').style.setProperty('--fit', k);
}
addEventListener('resize', fitViewport);
render(FMT).then(fitViewport);
</script>
