<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کتیبه — پوستر نشست‌های کتاب‌خوانی</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   جهت‌گیریِ هنریِ «ج» — کتیبه
   ── مفهوم ──────────────────────────────────────────────────────────────
   پوستر از دو پلانِ رنگیِ تخت ساخته شده و یک کتیبهٔ کاشیِ باریک آن‌ها را
   از هم جدا می‌کند: بالا فیروزهٔ عمیق و ماهِ شنگرفی، پایین کاغذِ روشن و
   اطلاعات. تنها تزئینِ طرح، همان یک نوارِ گرهِ هشت‌پر است.
   ═════════════════════════════════════════════════════════════════════════ */

:root{
  --teal:   #0E6E6E;   /* فیروزهٔ عمیق — پلانِ بالا */
  --teal-dk:#0A5150;
  --ivory:  #F7F3EA;   /* کاغذِ روشن — پلانِ پایین */
  --ink:    #1C2422;   /* مرکّبِ سبزْتیره — متن */
  --vermil: #D24327;   /* شنگرف — ماه و تأکید */
  --ochre:  #E3A03A;   /* زرِ گرم — عدد و کاشی */

  --sans: 'Vazirmatn', system-ui, sans-serif;
  --serif:'Markazi Text', 'Vazirmatn', serif;
  --disp: 'Lalezar', 'Vazirmatn', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#101614;overflow:hidden}
body{display:grid;place-items:center}
.stage{transform:scale(var(--fit,1));transform-origin:center}

.poster{
  --u: calc(var(--W) / 1080 * 1px);
  --bleed:0px;
  --padX: calc(80 * var(--u));
  position:relative;overflow:hidden;
  width:calc(var(--W) * 1px + 2 * var(--bleed));
  height:calc(var(--H) * 1px + 2 * var(--bleed));
  background:var(--ivory);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.poster.bleed{--bleed:11.34px}
.tex{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.26;
  background-image:var(--grain);background-size:calc(280 * var(--u)) calc(280 * var(--u))}

.trim{position:absolute;inset:var(--bleed);display:flex;flex-direction:column}
.trim > *{flex:0 0 auto}

/* ── پلانِ بالا: فیروزه، ماهِ شنگرفی، عنوان ───────────────────────────── */
.plane{position:relative;background:var(--teal);overflow:hidden;
  height:calc(var(--plane) * var(--u));
  padding:calc(var(--padT, 52) * var(--u)) var(--padX) calc(44 * var(--u))}
.plane .deco{position:absolute;inset:0}
.plane .deco svg{display:block;width:100%;height:100%}
.plane .inner{position:relative;height:100%;display:flex;flex-direction:column;
  justify-content:space-between}
.mast .org{font-size:calc(21 * var(--u));font-weight:600;color:var(--ivory);
  letter-spacing:-.004em}
.mast .ser{margin-top:calc(7 * var(--u));font-size:calc(14 * var(--u));font-weight:400;
  letter-spacing:.14em;color:rgba(247,243,234,.72)}
.mast .bar{margin-top:calc(14 * var(--u));width:calc(56 * var(--u));height:calc(3 * var(--u));
  background:var(--ochre)}

.title{font-family:var(--disp);font-weight:400;line-height:1.08;color:var(--ivory);
  font-size:calc(88 * var(--u))}
.accent{display:block;font-family:var(--disp);line-height:.94;color:var(--ochre);
  font-size:calc(184 * var(--u));margin-top:calc(4 * var(--u))}

/* ── کتیبهٔ کاشی ────────────────────────────────────────────────────── */
.frieze{height:calc(var(--frieze) * var(--u));background:var(--ochre)}
.frieze svg{display:block;width:100%;height:100%}

/* ── پلانِ پایین: اطلاعات ────────────────────────────────────────────── */
.body{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  padding:calc(30 * var(--u)) var(--padX) calc(var(--padB, 34) * var(--u))}
.body > *{flex:0 0 auto}
.gap{flex:1 1 auto;min-height:calc(6 * var(--u))}
.gap.s{flex:.6 1 auto}

.lbl{font-size:calc(13.5 * var(--u));font-weight:600;letter-spacing:.2em;color:var(--teal)}
.work{position:relative}
.book{font-family:var(--serif);font-weight:700;font-size:calc(54 * var(--u));line-height:1.08;
  margin-top:calc(7 * var(--u))}
.book + .book{margin-top:calc(3 * var(--u))}
.author{margin-top:calc(9 * var(--u));font-size:calc(21 * var(--u));font-weight:500;
  color:rgba(28,36,34,.66)}

/* اهالی نشست: سه ستونِ آزاد، بدون خط و بدون قاب */
.people{margin-top:calc(26 * var(--u));display:grid;gap:calc(22 * var(--u));
  grid-template-columns:repeat(var(--peopleCols, 3), 1fr)}
.names{margin-top:calc(6 * var(--u));font-size:calc(26 * var(--u));font-weight:700;
  line-height:1.42;letter-spacing:-.012em}

/* زمان و مکان: بلوکِ فیروزه‌ای، تنها لکهٔ رنگیِ نیمهٔ پایین */
.when{margin-top:calc(24 * var(--u));display:grid;
  grid-template-columns:auto 1fr;gap:calc(24 * var(--u));align-items:center;
  border-top:calc(3 * var(--u)) solid var(--teal);padding-top:calc(18 * var(--u))}
.when .date{font-family:var(--disp);font-size:calc(42 * var(--u));line-height:1.16;
  color:var(--teal);white-space:nowrap}
.when .hour{font-family:var(--disp);font-size:calc(42 * var(--u));color:var(--vermil);
  white-space:nowrap}
.when .place{grid-column:1 / -1}
.when .venue{font-size:calc(26 * var(--u));font-weight:700;letter-spacing:-.012em}
.when .addr{margin-top:calc(5 * var(--u));font-size:calc(16 * var(--u));
  color:rgba(28,36,34,.60);display:flex;gap:calc(15 * var(--u));flex-wrap:wrap}
.when .addr b{font-weight:600;color:var(--vermil)}

.logos{margin-top:calc(20 * var(--u));display:flex;align-items:center;
  gap:calc(14 * var(--u));flex-wrap:wrap}
.logos .cap{font-size:calc(12.5 * var(--u));font-weight:600;letter-spacing:.18em;
  color:rgba(28,36,34,.40);white-space:nowrap}
.logo{font-size:calc(14.5 * var(--u));font-weight:600;color:rgba(28,36,34,.80);
  display:flex;align-items:center;gap:calc(14 * var(--u));white-space:nowrap}
.logo::before{content:"";width:calc(5 * var(--u));height:calc(5 * var(--u));
  background:var(--ochre);transform:rotate(45deg)}
.logo.opt{color:rgba(28,36,34,.44)}
.logo img{height:calc(44 * var(--u));width:auto;display:block}
.latin{margin-top:calc(10 * var(--u));direction:ltr;text-align:left;
  font-size:calc(10.5 * var(--u));font-weight:500;letter-spacing:.24em;
  color:rgba(28,36,34,.34)}

.marks{position:absolute;inset:0;pointer-events:none;display:none;z-index:3}
.poster.bleed .marks{display:block}
.marks i{position:absolute;background:rgba(28,36,34,.7)}
@media print{ html,body{background:#fff;overflow:visible} @page{ size:auto; margin:0 } }
</style>
</head>
<body>

<script>
/* ✏️ اطلاعاتِ نشست — همان ساختارِ الگوی اصلی */
const DATA = {
  organizer: 'کانون نمایشنامه‌نویسان و مترجمان خانه تئاتر',
  series:    'نشست‌های کتاب‌خوانی، نقد و بررسی آثار نمایشی',
  title:     'نقد و بررسی کتاب',
  accent:    '۱۴۰۵',
  booksLabel:'اثر مورد بررسی',
  books:     ['[عنوان کتاب اول]', '[عنوان کتاب دوم]'],
  author:    'نوشته [نام نویسنده / نویسندگان]',
  rows: [
    { label:'با حضور و نقد',    names:['[نام منتقد اول]', '[نام منتقد دوم]'] },
    { label:'رئیس جلسه / مجری', names:['[نام مجری]'] },
    { label:'مهمان ویژه',       names:['[نام مهمان ویژه]'] },
  ],
  date:  'پنجشنبه ۲۹ مرداد ۱۴۰۵',
  time:  '۱۷:۰۰',
  venue: 'سالن مشاهیر تئاتر شهر تهران',
  address:'[آدرس کامل محل برگزاری]',
  entry: 'ورود برای عموم آزاد است',
  logos: [
    { name:'کانون نمایشنامه‌نویسان و مترجمان', required:true  },
    { name:'خانه تئاتر',                      required:true  },
    { name:'تئاتر شهر',                       required:true  },
    { name:'مرکز هنرهای نمایشی',              required:false },
    { name:'اداره کل هنرهای نمایشی رادیو',    required:false },
  ],
  latin: 'IRANIAN PLAYWRIGHTS & TRANSLATORS GUILD · HOUSE OF THEATRE',
};

const FORMATS = {
  post:  { W:1080,    H:1350,   plane:640, frieze:70, title:88, accent:184 },
  story: { W:1080,    H:1920,   plane:830, frieze:76, title:94, accent:196, padT:212, padB:200 },
  print: { W:1122.52, H:1587.4, plane:700, frieze:72, title:90, accent:188, bleed:true },
};
</script>

<div class="stage"><article class="poster" id="poster"></article></div>

<script>
const GRAIN = "url(\"data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280">' +
  '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.7 0.9" numOctaves="3" stitchTiles="stitch"/>' +
  '<feColorMatrix type="saturate" values="0"/></filter>' +
  '<rect width="280" height="280" filter="url(#n)" opacity="0.5"/></svg>') + "\")";

/* ستارهٔ هشت‌پر — واحدِ گرهِ کاشی */
function star(cx, cy, R, r){
  let p = [];
  for (let i = 0; i < 16; i++){
    const a = -Math.PI / 2 + i * Math.PI / 8, rad = i % 2 ? r : R;
    p.push((cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2));
  }
  return p.join(' ');
}

/* ── کتیبه: نوارِ گرهِ هشت‌پر و چلیپا ─────────────────────────────────── */
function frieze(h){
  const s = h, R = h * .46, r = R * .414;
  const Wf = 1080;
  return `<svg viewBox="0 0 ${Wf} ${s}" preserveAspectRatio="xMidYMid slice"
      xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
    <defs><pattern id="knot" width="${s}" height="${s}" patternUnits="userSpaceOnUse">
      <rect width="${s}" height="${s}" fill="#E3A03A"/>
      <polygon points="${star(s/2, s/2, R, r)}" fill="#0E6E6E"/>
      <polygon points="${star(0, 0, R, r)}" fill="#0E6E6E"/>
      <polygon points="${star(s, 0, R, r)}" fill="#0E6E6E"/>
      <polygon points="${star(0, s, R, r)}" fill="#0E6E6E"/>
      <polygon points="${star(s, s, R, r)}" fill="#0E6E6E"/>
      <rect x="${s/2 - 4}" y="-4" width="8" height="8" fill="#D24327" transform="rotate(45 ${s/2} 0)"/>
      <rect x="${s/2 - 4}" y="${s - 4}" width="8" height="8" fill="#D24327"
            transform="rotate(45 ${s/2} ${s})"/>
      <rect x="-4" y="${s/2 - 4}" width="8" height="8" fill="#D24327" transform="rotate(45 0 ${s/2})"/>
      <rect x="${s - 4}" y="${s/2 - 4}" width="8" height="8" fill="#D24327"
            transform="rotate(45 ${s} ${s/2})"/>
    </pattern></defs>
    <rect width="${Wf}" height="${s}" fill="url(#knot)"/>
  </svg>`;
}

/* ماهِ شنگرفی + هالهٔ ترام روی پلانِ فیروزه‌ای */
function deco(w, h){
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="tram" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="2.3" fill="#F7F3EA"/>
    </pattern></defs>
    <circle cx="${w * .28}" cy="${h * .40}" r="${h * .305}" fill="#D24327"/>
    <g opacity=".15"><circle cx="${w * .28}" cy="${h * .40}" r="${h * .46}" fill="url(#tram)"/></g>
    <circle cx="${w * .28}" cy="${h * .40}" r="${h * .305}" fill="none" stroke="#E3A03A"
            stroke-width="3" opacity=".7" transform="translate(11,12)"/>
  </svg>`;
}

function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function build(fmt){
  const F = FORMATS[fmt] || FORMATS.post;
  const el = document.getElementById('poster');
  el.className = 'poster' + (F.bleed ? ' bleed' : '');
  el.style.setProperty('--W', F.W);
  el.style.setProperty('--H', F.H);
  el.style.setProperty('--grain', GRAIN);
  el.style.setProperty('--plane', F.plane);
  el.style.setProperty('--frieze', F.frieze);
  if (F.padT) el.style.setProperty('--padT', F.padT);
  if (F.padB) el.style.setProperty('--padB', F.padB);

  const groups = DATA.rows.filter(r => r.names && r.names.filter(Boolean).length);

  el.innerHTML = `
    <div class="marks">${['0 0','1 0','0 1','1 1'].map(p=>{
      const [x,y] = p.split(' ').map(Number);
      const v = `${x?'right':'left'}:calc(var(--bleed) - 1px);${y?'bottom':'top'}:0;width:1px;height:var(--bleed)`;
      const h = `${y?'bottom':'top'}:calc(var(--bleed) - 1px);${x?'right':'left'}:0;height:1px;width:var(--bleed)`;
      return `<i style="${v}"></i><i style="${h}"></i>`;}).join('')}</div>

    <div class="trim">
      <header class="plane">
        <div class="deco">${deco(1080, F.plane)}</div>
        <div class="inner">
          <div class="mast">
            <div class="org">${esc(DATA.organizer)}</div>
            <div class="ser">${esc(DATA.series)}</div>
            <div class="bar"></div>
          </div>
          <div>
            <h1 class="title" id="title">${esc(DATA.title)}</h1>
            ${DATA.accent ? `<span class="accent" id="accent">${esc(DATA.accent)}</span>` : ''}
          </div>
        </div>
      </header>

      <div class="frieze">${frieze(F.frieze)}</div>

      <div class="body">
        <section class="work">
          <div>
            <div class="lbl">${esc(DATA.booksLabel)}</div>
            ${DATA.books.filter(Boolean).map(b => `<div class="book">${esc(b)}</div>`).join('')}
            ${DATA.author ? `<div class="author">${esc(DATA.author)}</div>` : ''}
          </div>
        </section>

        <div class="gap s"></div>

        <section class="people" style="--peopleCols:${groups.length}">
          ${groups.map(g => `<div><div class="lbl">${esc(g.label)}</div>
            <div class="names">${g.names.filter(Boolean).map(esc).join('<br>')}</div></div>`).join('')}
        </section>

        <div class="gap"></div>

        <section class="when">
          <div class="date">${esc(DATA.date)}</div>
          ${DATA.time ? `<div class="hour">ساعت ${esc(DATA.time)}</div>` : '<div></div>'}
          <div class="place">
            ${DATA.venue ? `<div class="venue">${esc(DATA.venue)}</div>` : ''}
            <div class="addr"><span>${esc(DATA.address || '')}</span>
              ${DATA.entry ? `<b>${esc(DATA.entry)}</b>` : ''}</div>
          </div>
        </section>

        <footer class="logos">
          <span class="cap">با همکاری</span>
          ${DATA.logos.map(l => `<span class="logo${l.required ? '' : ' opt'}">${esc(l.name)}</span>`).join('')}
        </footer>
        ${DATA.latin ? `<div class="latin">${esc(DATA.latin)}</div>` : ''}
      </div>
    </div>
    <div class="tex"></div>`;
}

function lineCount(el){
  const r = document.createRange(); r.selectNodeContents(el);
  return new Set([...r.getClientRects()].filter(b => b.height > 1)
    .map(b => Math.round(b.top))).size || 1;
}
function fitText(el, maxPx, minPx, maxLines){
  if (!el) return;
  let lo = minPx, hi = maxPx;
  el.style.fontSize = maxPx + 'px';
  if (lineCount(el) <= maxLines) return;
  for (let i = 0; i < 18; i++){
    const mid = (lo + hi) / 2;
    el.style.fontSize = mid + 'px';
    if (lineCount(el) <= maxLines) lo = mid; else hi = mid;
  }
  el.style.fontSize = lo + 'px';
}

async function render(fmt){
  build(fmt);
  await document.fonts.ready;
  const F = FORMATS[fmt] || FORMATS.post;
  const u = F.W / 1080;
  fitText(document.getElementById('accent'), F.accent * u, 60 * u, 1);
  fitText(document.getElementById('title'), F.title * u, 34 * u, 2);
  const books = [...document.querySelectorAll('.book')];
  books.forEach(b => fitText(b, (books.length > 1 ? 46 : 58) * u, 24 * u, 2));

  const body = document.querySelector('.body');
  body.style.transform = 'none';
  const kids = [...body.children];
  const inner = kids[kids.length - 1].getBoundingClientRect().bottom
              - body.getBoundingClientRect().top - parseFloat(getComputedStyle(body).paddingTop);
  const avail = body.clientHeight - parseFloat(getComputedStyle(body).paddingTop)
                                  - parseFloat(getComputedStyle(body).paddingBottom);
  if (inner > avail + 1){
    const k = Math.max(0.78, avail / inner);
    body.style.transformOrigin = 'top center';
    body.style.transform = `scale(${k})`;
  }
  document.body.dataset.ready = '1';
}

const P = new URLSearchParams(location.search);
const FMT = P.get('f') || 'post';
function fitViewport(){
  if (P.get('fit') === '0'){ document.querySelector('.stage').style.setProperty('--fit', 1); return; }
  const F = FORMATS[FMT] || FORMATS.post;
  const b = F.bleed ? 22.68 : 0;
  const k = Math.min(1, (innerWidth - 24) / (F.W + b), (innerHeight - 24) / (F.H + b));
  document.querySelector('.stage').style.setProperty('--fit', k);
}
addEventListener('resize', fitViewport);
render(FMT).then(fitViewport);
</script>
</body>
</html>
